name: BPD Daily Report

on:
  schedule:
    - cron: "15 0 * * *" # UTC 00:15 = 台北時間 08:15
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            echo "target=$TARGET" >> $GITHUB_OUTPUT
          fi
          echo "Date: $(cat $GITHUB_OUTPUT | grep target | cut -d= -f2)"

      - name: Configure NVIDIA Nemotron backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("src/generate_report.js")
          s = p.read_text(encoding="utf-8")
          s = s.replace("https://open.bigmodel.cn/api/coding/paas/v4", "https://integrate.api.nvidia.com/v1")
          for old, new in [
              ("GLM-5-Turbo", "nvidia/nemotron-3-super-120b-a12b"),
              ("glm-5-turbo", "nvidia/nemotron-3-super-120b-a12b"),
              ("GLM-4.7-Flash", "nvidia/nemotron-3-nano-30b-a3b"),
              ("glm-4.7-flash", "nvidia/nemotron-3-nano-30b-a3b"),
              ("GLM-4.7", "nvidia/nemotron-3-nano-30b-a3b"),
              ("glm-4.7", "nvidia/nemotron-3-nano-30b-a3b"),
          ]:
              s = s.replace(old, new)
          s = re.sub(r"const MAX_TOKENS = [0-9_]+;", "const MAX_TOKENS = 16384;", s)
          s = re.sub(r"max_tokens:\s*[0-9_]+,", "max_tokens: 16384,", s)
          s = s.replace("temperature: 0.3", "temperature: 1.0")
          s = s.replace("top_p: 0.9", "top_p: 0.95")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Run daily report with NVIDIA Nemotron
        env:
          ZHIPU_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          test -n "$ZHIPU_API_KEY" || { echo "::error::Missing NVIDIA_API_KEY repository secret"; exit 1; }
          node src/main.js --date=${{ steps.date.outputs.target }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/summarized_pmids.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "📄 BPD daily report: ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push

      - name: Summary
        if: always()
        run: |
          echo "### 📄 BPD Research Daily Report" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${{ steps.date.outputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "**Report:** [bpd-${{ steps.date.outputs.target }}.html](https://u8901006.github.io/irritable-bowel/bpd-${{ steps.date.outputs.target }}.html)" >> $GITHUB_STEP_SUMMARY
